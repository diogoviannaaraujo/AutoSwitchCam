name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: Sign and upload the macOS app to TestFlight
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'testflight' }}
  queue: max
  cancel-in-progress: false

jobs:
  checks:
    name: Test and archive macOS app
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      version: ${{ steps.archive.outputs.version }}
      build-number: ${{ steps.archive.outputs.build-number }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-project

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests

      - name: Run core tests
        run: |
          xcodebuild test -workspace AutoSwitchCam.xcworkspace -scheme AutoSwitchCore \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/autoswitchcam-tests" \
            -resultBundlePath "$RUNNER_TEMP/AutoSwitchCore.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO

      - name: Archive app and camera extension
        id: archive
        run: |
          source_build=$(xcodebuild -showBuildSettings -json -workspace AutoSwitchCam.xcworkspace \
            -scheme AutoSwitchCam -configuration Release | python3 -c '
          import json, sys
          print(next(item["buildSettings"]["CURRENT_PROJECT_VERSION"]
                     for item in json.load(sys.stdin) if item["target"] == "AutoSwitchCam"))')
          # Start above development builds already installed on this Mac.
          BUILD_NUMBER="$((source_build + GITHUB_RUN_NUMBER)).$GITHUB_RUN_ATTEMPT"
          xcodebuild archive -workspace AutoSwitchCam.xcworkspace -scheme AutoSwitchCam \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/AutoSwitchCam.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/autoswitchcam-archive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO
          app="$RUNNER_TEMP/AutoSwitchCam.xcarchive/Products/Applications/AutoSwitchCam.app"
          version=$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")
          test -d "$app/Contents/Library/SystemExtensions/com.diogoviannaaraujo.AutoSwitchCam.CameraExtension.systemextension"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          ditto Derived/Entitlements "$RUNNER_TEMP/AutoSwitchCam.xcarchive/Entitlements"
          ditto -c -k --keepParent "$RUNNER_TEMP/AutoSwitchCam.xcarchive" "$RUNNER_TEMP/AutoSwitchCam.xcarchive.zip"

      - name: Preserve archive
        uses: actions/upload-artifact@v4
        with:
          name: autoswitchcam-archive
          path: ${{ runner.temp }}/AutoSwitchCam.xcarchive.zip
          if-no-files-found: error
          retention-days: 7

      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoswitchcam-tests
          path: ${{ runner.temp }}/AutoSwitchCore.xcresult
          if-no-files-found: ignore
          retention-days: 7

  testflight:
    name: Sign and upload to TestFlight
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.testflight))
    needs: checks
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Apple credentials
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          INSTALLER: ${{ secrets.MACOS_INSTALLER_P12 }}
          INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          for name in CERTIFICATE CERTIFICATE_PASSWORD INSTALLER INSTALLER_PASSWORD API_KEY API_KEY_ID API_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is empty; configure the Apple secrets listed in docs/testflight.md."
              exit 1
            fi
          done

      - uses: actions/download-artifact@v4
        with:
          name: autoswitchcam-archive
          path: ${{ runner.temp }}/archive

      - name: Unpack archive
        run: ditto -x -k "$RUNNER_TEMP/archive/AutoSwitchCam.xcarchive.zip" "$RUNNER_TEMP"

      - name: Import Apple Distribution certificate
        id: certificate
        uses: ./.github/actions/import-signing-identity
        with:
          p12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          password: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          kind: Apple Distribution
          intermediates: AppleWWDRCAG3

      - name: Import Mac Installer Distribution certificate
        id: installer
        uses: ./.github/actions/import-signing-identity
        with:
          p12: ${{ secrets.MACOS_INSTALLER_P12 }}
          password: ${{ secrets.MACOS_INSTALLER_PASSWORD }}
          kind: 3rd Party Mac Developer Installer
          intermediates: AppleWWDRCAG3
          policy: basic
          keychain-name: autoswitchcam-installer
          trusted-tool: /usr/bin/productbuild

      - name: Prepare app and extension provisioning profiles
        env:
          API_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          IDENTITY: ${{ steps.certificate.outputs.identity }}
        run: |
          umask 077
          printf '%s\n' "$API_KEY" > "$RUNNER_TEMP/autoswitchcam-api.p8"
          python3 scripts/prepare-profiles.py --key "$RUNNER_TEMP/autoswitchcam-api.p8" \
            --identity "$IDENTITY" --output "$RUNNER_TEMP/autoswitchcam-profiles"

      - name: Sign app, camera extension and installer
        env:
          IDENTITY: ${{ steps.certificate.outputs.identity }}
          INSTALLER_IDENTITY: ${{ steps.installer.outputs.name }}
          INSTALLER_KEYCHAIN: ${{ steps.installer.outputs.keychain }}
        run: |
          python3 scripts/package-testflight.py \
            --archive "$RUNNER_TEMP/AutoSwitchCam.xcarchive" \
            --profiles "$RUNNER_TEMP/autoswitchcam-profiles" \
            --identity "$IDENTITY" --installer-identity "$INSTALLER_IDENTITY" \
            --installer-keychain "$INSTALLER_KEYCHAIN" \
            --output "$RUNNER_TEMP/autoswitchcam-testflight"

      - name: Upload and verify Apple processing
        env:
          API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          VERSION: ${{ needs.checks.outputs.version }}
          BUILD_NUMBER: ${{ needs.checks.outputs.build-number }}
        run: |
          xcrun altool --upload-package "$RUNNER_TEMP/autoswitchcam-testflight/AutoSwitchCam.pkg" \
            --api-key "$API_KEY_ID" --api-issuer "$API_ISSUER_ID" \
            --p8-file-path "$RUNNER_TEMP/autoswitchcam-api.p8" --wait
          python3 scripts/testflight-status.py --platform MAC_OS --version "$VERSION" \
            --build-number "$BUILD_NUMBER" --key "$RUNNER_TEMP/autoswitchcam-api.p8"

      - name: Preserve TestFlight package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoswitchcam-testflight-macos
          path: ${{ runner.temp }}/autoswitchcam-testflight/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove signing assets
        if: always()
        env:
          KEYCHAIN: ${{ steps.certificate.outputs.keychain }}
          INSTALLER_KEYCHAIN: ${{ steps.installer.outputs.keychain }}
        run: |
          rm -f "$RUNNER_TEMP/autoswitchcam-api.p8"
          rm -f "$RUNNER_TEMP/signing.p12"
          rm -rf "$RUNNER_TEMP/autoswitchcam-profiles"
          if [[ -n "$KEYCHAIN" ]]; then security delete-keychain "$KEYCHAIN"; fi
          if [[ -n "$INSTALLER_KEYCHAIN" ]]; then security delete-keychain "$INSTALLER_KEYCHAIN"; fi
