name: Set up AutoSwitchCam
description: Use Xcode 27 and the pinned Tuist version to generate the project.
runs:
  using: composite
  steps:
    - name: Check toolchain
      shell: bash
      run: |
        set -euo pipefail
        xcode_version=$(xcodebuild -version)
        printf '%s\n' "$xcode_version"
        swift --version
        [[ "$xcode_version" == "Xcode 27."* ]]
        test "$(uname -m)" = arm64

    - name: Install Tuist 4.110.3
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v tuist >/dev/null || [[ "$(tuist version)" != 4.110.3 ]]; then
          directory="$RUNNER_TEMP/tuist-4.110.3"
          mkdir -p "$directory"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/tuist/tuist/releases/download/4.110.3/tuist.zip \
            --output "$directory/tuist.zip"
          echo "cdedaf4cc7a8ccb52aeb01d1a0d7fd0f22cf443a100b169687fca0f75ef9face  $directory/tuist.zip" | shasum -a 256 -c -
          unzip -q -o "$directory/tuist.zip" -d "$directory"
          chmod +x "$directory/tuist"
          echo "$directory" >> "$GITHUB_PATH"
        fi

    - name: Generate project
      shell: bash
      run: tuist generate --no-open
